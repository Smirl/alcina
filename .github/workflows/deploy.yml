name: Deploy

on:
  push:
    tags:
      - v*
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to redeploy'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/smirl/alcina

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://alcinaengineering.co.uk/
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DEPLOY
      - name: Get tag name
        uses: olegtarasov/get-tag@v2.1
        if: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Use input tag
        run: echo "GIT_TAG_NAME=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
        if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Helm tool installer
        uses: Azure/setup-helm@v4
        with:
          version: '3.17.3'

      - uses: azure/k8s-set-context@v4
        with:
          method: service-account
          k8s-url: ${{ secrets.K8S_URL }}
          k8s-secret: ${{ secrets.K8S_SECRET }}

      - name: Helm repo add mvisonneau
        run: helm repo add mvisonneau https://charts.visonneau.fr/

      - name: Deploy
        run: helm upgrade --install alcinaengineering mvisonneau/generic-app --version 0.0.13 --namespace alcinaengineering -f deploy/values.yaml --set pods.image.tag=$GIT_TAG_NAME
